[package]
name = "buddy2api-server"
version = "0.1.39"
edition = "2021"
description = "buddy2api HTTP server + CLI（npm 安装形态：buddy2api 命令启动本地 webui）"

[[bin]]
name = "buddy2api"
path = "src/main.rs"

[dependencies]
buddy2api-core = { path = "../buddy2api-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
